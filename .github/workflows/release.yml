name: Release

# Pushing a v* tag builds the desktop installers for every platform and
# uploads them to a draft GitHub Release. Nothing is public until someone
# publishes the draft. Running it by hand from a branch builds the same
# installers as workflow artifacts without touching Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes of the same tag must not race to upload the same assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-latest
            rust-target: aarch64-apple-darwin
            bun-target: bun-darwin-arm64
          - name: macOS Intel
            # GitHub's macOS runners are Apple silicon, so Intel is cross-built.
            os: macos-latest
            rust-target: x86_64-apple-darwin
            bun-target: bun-darwin-x64
            # Pulls sharp's darwin-x64 native packages next to the host's arm64
            # ones. `*` rather than `x64` so arm64 build tools (rollup, esbuild)
            # stay installed for the web build.
            bun-install-flags: --os=darwin --cpu=*
          - name: Linux
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            bun-target: bun-linux-x64
          - name: Windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            bun-target: bun-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      # Installers and latest.json take the app's version, not the tag's. A
      # v0.2.0 tag over a 0.1.0 app would publish an update nobody receives.
      - name: Check the tag matches the app version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(bun -p 'require("./apps/desktop/package.json").version')
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' apps/desktop/src-tauri/Cargo.toml | head -n 1)
          if [ "$tag" != "$app" ] || [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the app version (apps/desktop/package.json $app, Cargo.toml $crate). Bump both, then tag again."
            exit 1
          fi

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.rust-target }}

      - run: bun install --frozen-lockfile ${{ matrix.bun-install-flags }}

      # Builds the web app, compiles the server for this target and stages
      # its resources (web, migrations, templates, sharp's native libs).
      - run: bun run desktop:sidecar --target ${{ matrix.bun-target }}

      # Signing is optional. Tauri treats a set-but-empty variable as "sign
      # with this", so an unset secret has to stay unset rather than arrive
      # as "". This step exports only the secrets that exist and collects
      # matching config overrides, so forks and unsigned builds still work.
      - name: Optional signing
        id: signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
        run: |
          export_if_set() {
            local value="${!1}"
            [ -n "$value" ] || return 0
            local eof="EOF_$(openssl rand -hex 8)"
            { echo "$1<<$eof"; printf '%s\n' "$value"; echo "$eof"; } >> "$GITHUB_ENV"
          }

          # Forward slashes so the path survives on Windows too.
          tmp="${RUNNER_TEMP//\\//}"
          # Merged over tauri.conf.json by --config; empty when nothing applies.
          overrides="$tmp/tauri.ci.conf.json"
          patch='{}'

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            # Apps built with the placeholder key could never verify an update,
            # so everyone on this release would be stuck on it. Stop here instead.
            pubkey=$(bun -p 'require("./apps/desktop/src-tauri/tauri.conf.json").plugins.updater.pubkey')
            if ! printf '%s' "$pubkey" | base64 --decode 2>/dev/null | grep -q "minisign public key"; then
              echo "::error::plugins.updater.pubkey in apps/desktop/src-tauri/tauri.conf.json isn't a Tauri updater public key. Paste the .pub file's contents there (docs/desktop.md, The updater key)."
              exit 1
            fi
            export_if_set TAURI_SIGNING_PRIVATE_KEY
            export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            # Without the key Tauri refuses to build updater bundles, so skip
            # them. The installers still work; they just can't self-update.
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set, building without in-app updates."
            patch='{"bundle":{"createUpdaterArtifacts":false}}'
            echo "updater=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "$RUNNER_OS" = "macOS" ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              export_if_set "$name"
            done
          fi

          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_THUMBPRINT" ]; then
            # Import the .pfx into the runner's store; signtool then finds it by thumbprint.
            export PFX_PATH="$tmp/certificate.pfx"
            echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$PFX_PATH"
            pwsh -NoProfile -Command 'Import-PfxCertificate -FilePath $env:PFX_PATH -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText) | Out-Null'
            rm "$PFX_PATH"
            patch=$(PATCH="$patch" bun -e '
              const patch = JSON.parse(process.env.PATCH);
              patch.bundle = { ...patch.bundle, windows: {
                certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
                digestAlgorithm: "sha256",
                timestampUrl: "http://timestamp.digicert.com",
              } };
              console.log(JSON.stringify(patch));
            ')
          fi

          printf '%s\n' "$patch" > "$overrides"
          echo "config=$overrides" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          # Only a tag push creates a release; a manual run just builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: Openfield ${{ github.ref_name }}
          releaseBody: |
            Download the installer for your computer below.

            These builds are not signed yet, so your computer will ask before opening them the first time. See https://github.com/${{ github.repository }}/blob/main/docs/desktop.md#installing-an-unsigned-build for the one-time steps.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: ${{ steps.signing.outputs.updater }}
          uploadWorkflowArtifacts: ${{ github.ref_type != 'tag' }}
          args: --target ${{ matrix.rust-target }} --config ${{ steps.signing.outputs.config }}
