<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Openfield</title>
    <!-- Shown while the local server starts. The app navigates away as soon as it is ready. -->
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1012;
        --bone: #e9e3d8;
        --muted: rgba(233, 227, 216, 0.56);
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--bone);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        cursor: default;
        user-select: none;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
      }
      svg {
        width: 56px;
        height: 56px;
        fill: var(--bone);
        animation: turn 2s linear infinite;
      }
      p {
        margin: 0;
        font-size: 13px;
        letter-spacing: 0.01em;
        color: var(--muted);
      }
      /* A quarter turn is a full cycle: the four petals are identical. */
      @keyframes turn {
        to {
          transform: rotate(90deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 56 56" aria-hidden="true">
        <path d="M9.595 28.276L16.92 17.778A3.911 3.911 0 0 1 23.334 22.254L16.009 32.751A3.911 3.911 0 0 1 9.595 28.276Z" />
        <path d="M27.724 9.595L38.222 16.92A3.911 3.911 0 0 1 33.746 23.334L23.249 16.009A3.911 3.911 0 0 1 27.724 9.595Z" />
        <path d="M46.405 27.724L39.08 38.222A3.911 3.911 0 0 1 32.666 33.746L39.991 23.249A3.911 3.911 0 0 1 46.405 27.724Z" />
        <path d="M28.276 46.405L17.778 39.08A3.911 3.911 0 0 1 22.254 32.666L32.751 39.991A3.911 3.911 0 0 1 28.276 46.405Z" />
      </svg>
      <p>Starting Openfield…</p>
    </main>
  </body>
</html>
