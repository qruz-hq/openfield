[package]
name = "openfield-desktop"
version = "0.1.1"
description = "Openfield desktop app: a window around the local Openfield server."
license = "MIT"
repository = "https://github.com/qruz-hq/openfield"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "openfield"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["image-png"] }
tauri-plugin-shell = "2.4.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.1"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5.2"

[target.'cfg(windows)'.dependencies]
windows-version = "0.1.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSProcessInfo", "NSString", "NSUserDefaults"] }
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSResponder"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
